<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Offline · DisinfEntry</title>
<link rel="icon" type="image/png" href="assets/icons/favicon-32.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left));
    background: linear-gradient(160deg, #0f172a 0%, #10202f 60%, #0d3b30 100%);
    color: #e2e8f0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    text-align: center;
  }
  .card { max-width: 380px; }
  img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  h1 { font-size: 1.35rem; margin: 22px 0 8px; color: #fff; }
  p { margin: 0 0 22px; color: #94a3b8; line-height: 1.5; font-size: .95rem; }
  button {
    appearance: none; border: 0; cursor: pointer;
    background: #0d7a5f; color: #fff;
    font: inherit; font-weight: 600;
    padding: 12px 26px; border-radius: 12px;
    min-height: 48px;
  }
  button:active { transform: scale(.98); }
  .hint { margin-top: 18px; font-size: .8rem; color: #64748b; }
</style>
</head>
<body>
  <div class="card">
    <img src="assets/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>DisinfEntry can't reach the monitoring server. Live readings and alerts will resume
       as soon as the connection is back.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <div class="hint">Check the phone's WiFi or mobile data.</div>
  </div>
  <script>
    // Come back by itself once the network returns.
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
